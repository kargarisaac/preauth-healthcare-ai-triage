    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nazmito" />

    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!-- Favicon and Icons -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#1E40AF" />

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />

    <!-- Preload critical fonts -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" /></noscript>

    <!-- Preload JetBrains Mono for code display -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" /></noscript>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nazmito.com/" />
    <meta property="og:title" content="Nazmito - Healthcare Pre-Authorization Intelligence" />
    <meta property="og:description" content="AI-powered pre-authorization platform for UAE healthcare insurance. Process eClaimLink and Shafafiya data with intelligent automation." />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://nazmito.com/" />
    <meta property="twitter:title" content="Nazmito - Healthcare Pre-Authorization Intelligence" />
    <meta property="twitter:description" content="AI-powered pre-authorization platform for UAE healthcare insurance" />
    <meta property="twitter:image" content="/twitter-image.png" />

    <!-- Critical CSS inline placeholder -->
    <style>
      /* Theme detection and initialization */
      :root {
        color-scheme: light dark;
      }

      /* Critical above-the-fold styles */
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f9fafb;
        transition: background-color 0.2s ease, color 0.2s ease;
      }

      /* Dark mode styles */
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0f1419;
          color: #f7fafc;
        }
      }

      /* Manual dark mode class takes precedence */
      .dark {
        color-scheme: dark;
      }

      .dark body {
        background-color: #0f1419;
        color: #f7fafc;
      }

      #root {
        min-height: 100vh;
      }

      /* Loading spinner styles */
      .loading-spinner {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid #f3f3f3;
        border-radius: 50%;
        border-top-color: #1E40AF;
        animation: spin 1s ease-in-out infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Prevent flash of unstyled content */
      .min-h-screen {
        min-height: 100vh;
      }
    </style>

    <title>Nazmito - Healthcare Pre-Authorization Intelligence</title>
  </head>
  <body>
    <!-- Loading fallback -->
    <noscript>
      <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: Inter, sans-serif; text-align: center; padding: 20px;">
        <div>
          <h1 style="color: #1E40AF; margin-bottom: 16px;">Nazmito</h1>
          <p style="color: #6B7280;">JavaScript is required to run this application. Please enable JavaScript in your browser.</p>
        </div>
      </div>
    </noscript>

    <div id="root">
      <!-- Initial loading state -->
      <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
        <div class="loading-spinner"></div>
      </div>
    </div>

    <!-- Theme initialization script (must run before React) -->
    <script>
      // Theme initialization
      (function() {
        function setTheme(theme) {
          if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        }

        // Load saved theme from localStorage
        try {
          const savedTheme = localStorage.getItem('nazmito-theme');
          if (savedTheme) {
            setTheme(savedTheme);
          } else {
            // Default to system preference
            setTheme('system');
          }
        } catch (e) {
          // Fallback to system preference if localStorage fails
          setTheme('system');
        }

        // Listen for system theme changes
        if (window.matchMedia) {
          const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
          const handleChange = () => {
            try {
              const currentTheme = localStorage.getItem('nazmito-theme');
              if (currentTheme === 'system' || !currentTheme) {
                setTheme('system');
              }
            } catch (e) {
              setTheme('system');
            }
          };
          
          if (mediaQuery.addEventListener) {
            mediaQuery.addEventListener('change', handleChange);
          } else if (mediaQuery.addListener) {
            mediaQuery.addListener(handleChange);
          }
        }
      })();

      // Mark the start of loading
      if ('performance' in window && 'mark' in performance) {
        performance.mark('html-loaded');
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration (handled by Vite PWA plugin) -->
  </body>
</html>
