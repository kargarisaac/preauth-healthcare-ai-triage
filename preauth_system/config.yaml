dataset:
  base_path: data/dataset_2/synthetic_dataset
  fhir_path: data/dataset_2/synthetic_dataset/FHIR_JSON
  xml_path: data/dataset_2/synthetic_dataset/UAE_XML

rag:
  large_file_token_threshold: 10000
  max_large_files: 3
  cache:
    ttl_minutes: 60
  openai_file_registry_path: output/openai_files.json
  kb_token_csv_path: preauth_system/rag/kb/kb_token_counts.csv

tracing:
  dir: output/traces

orchestration:
  type: asyncio
  timeout_seconds: 300
  parallel_phases: true

# Centralized LLM configuration
llm:
  # # Back-compat key (used if default_model is missing)
  # model: openrouter/openai/gpt-oss-20b
  # # New preferred default key
  # default_model: openrouter/openai/gpt-oss-20b
  model: openrouter/openai/gpt-4o-mini
  default_model: openrouter/openai/gpt-4o-mini
  # Optional per-agent overrides (by agent METADATA name)
  agents:
    clinical-analyzer:
      model: openrouter/openai/gpt-oss-20b
    medication-specialist:
      model: openrouter/openai/gpt-oss-20b
    risk-assessor:
      model: openrouter/openai/gpt-oss-20b
    decision-maker:
      model: openrouter/openai/gpt-oss-20b
    compliance-auditor:
      model: openrouter/openai/gpt-oss-20b
  # Optional per-module overrides (by module id)
  modules:
    clinical_summary:
      model: openrouter/openai/gpt-oss-20b
    specialty_determination:
      model: openrouter/openai/gpt-oss-20b
    final_report:
      model: openrouter/openai/gpt-oss-20b
    clinical_risk:
      model: openrouter/openai/gpt-oss-20b
    data_quality:
      model: openrouter/openai/gpt-oss-20b
    dossier_writer:
      model: openrouter/openai/gpt-4o-mini