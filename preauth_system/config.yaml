agents:
  # Default model for agents when not specified in agent .md files
  default_model: openai/gpt-oss-120b
  default_reasoning_effort: medium
  # Provider selection (manual): openai | openrouter
  # - openai: uses native OpenAI API (OPENAI_API_KEY), e.g., models like gpt-5, gpt-4o
  # - openrouter: uses OpenRouter's OpenAI-compatible API (OPENROUTER_API_KEY)
  provider: openrouter
  openrouter:
    base_url: https://openrouter.ai/api/v1
    # API key should be provided via environment variable OPENROUTER_API_KEY
    # Optional attribution headers (may appear on OpenRouter leaderboards)
    site_url: null
    app_name: null

dataset:
  base_path: data/dataset_2/synthetic_dataset
  fhir_path: data/dataset_2/synthetic_dataset/FHIR_JSON
  xml_path: data/dataset_2/synthetic_dataset/UAE_XML

rag:
  large_file_token_threshold: 10000
  max_large_files: 3
  cache:
    ttl_minutes: 60
  openai_file_registry_path: output/openai_files.json
  kb_token_csv_path: preauth_system/rag/kb/kb_token_counts.csv

tracing:
  dir: output/traces

pricing:
  model_rates:
    gpt-5:
      input_new: 15.0
      input_cached: 7.5
      output: 60.0
      reasoning: 60.0 