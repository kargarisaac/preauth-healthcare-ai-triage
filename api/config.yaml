# Nazmito API Configuration
# Configuration file for patient-centric workflow and dataset management

dataset:
  # Main dataset paths
  raw_data_path: "data/raw_data"
  processed_data_path: "data/processed_data"
  
  # Additional paths
  test_data_path: "data/test_data"
  backup_path: "data/backups"
  logs_path: "logs"

processing:
  # Auto-detection settings
  auto_detect_source: true
  
  # Supported XML formats
  supported_formats:
    - "xml"
  
  # Source detection patterns
  source_detection:
    eclaim_patterns:
      - "dubai_*.xml"
      - "*_eclaim.xml"
      - "eclaim_*.xml"
    shafafiya_patterns:
      - "abudhabi_*.xml"
      - "*_shafafiya.xml"
      - "shafafiya_*.xml"
  
  # Default fallback source when detection fails
  default_source: "eclaim"
  
  # File naming conventions
  file_naming:
    include_patient_id: true
    include_timestamp: true
    include_source: true
    
  # Processing limits
  max_file_size_mb: 50
  batch_size: 10

patient:
  # Patient data management
  profile_filename: "profile.json"
  dataset_index_filename: "dataset_index.csv"
  
  # Validation settings
  require_profile: true
  validate_folder_structure: true
  
  # History settings
  max_history_files: 100
  sort_chronologically: true

claude:
  # Claude analysis configuration
  enabled: true
  multi_agent: true
  
  # Cost management
  default_cost_limit_usd: 1.0
  max_cost_limit_usd: 10.0
  
  # Analysis settings
  include_history_by_default: true
  enable_progress_tracking: true
  
  # Performance settings
  timeout_seconds: 300
  max_retries: 3

api:
  # API server settings
  host: "0.0.0.0"
  port: 8000
  debug: false
  
  # CORS settings
  cors_enabled: true
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
  
  # Rate limiting
  rate_limit_enabled: true
  requests_per_minute: 60
  
  # Upload settings
  max_upload_size_mb: 100
  allowed_extensions:
    - ".xml"
    - ".json"

logging:
  # Logging configuration
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name}:{function}:{line} | {message}"
  
  # Log files
  api_log_file: "logs/api.log"
  processing_log_file: "logs/processing.log"
  claude_log_file: "logs/claude.log"
  
  # Rotation settings
  rotation: "10 MB"
  retention: "30 days"
  compression: "gz"

security:
  # Security settings
  enable_auth: false
  secret_key: "your-secret-key-here"
  
  # Data privacy
  anonymize_logs: true
  mask_patient_ids: false
  
  # File validation
  validate_xml_schema: true
  scan_for_malicious_content: true

monitoring:
  # Monitoring and metrics
  enable_metrics: true
  metrics_endpoint: "/metrics"
  
  # Health checks
  health_check_enabled: true
  health_check_interval_seconds: 30
  
  # Performance tracking
  track_processing_times: true
  track_costs: true
  track_success_rates: true

# Environment-specific overrides
development:
  api:
    debug: true
    port: 8000
  logging:
    level: "DEBUG"
  security:
    enable_auth: false

production:
  api:
    debug: false
    port: 80
  logging:
    level: "INFO"
  security:
    enable_auth: true
    
testing:
  dataset:
    raw_data_path: "data/test_data"
    processed_data_path: "data/test_processed"
  logging:
    level: "WARNING"